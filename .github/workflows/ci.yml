name: installed-wheel-http-artifact
on: [push, pull_request]
jobs:
  installed-wheel:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-index --find-links dist rangeresume
      - name: Ordinary installed tests and real registered CLI
        shell: python
        run: |
          import os,pathlib,subprocess,tempfile
          repo=pathlib.Path.cwd()
          env=os.environ.copy()
          env.pop('PYTHONPATH',None)
          with tempfile.TemporaryDirectory() as folder:
              subprocess.run(['python','-I','-c','import rangeresume;print(rangeresume.__file__)'],cwd=folder,env=env,check=True)
              subprocess.run(['python','-I','-m','unittest','discover','-s',str(repo/'tests'),'-v'],cwd=folder,env=env,check=True)
              subprocess.run(['rangeresume','pilot','pilot-output'],cwd=folder,env=env,check=True,stdout=subprocess.DEVNULL)
